# ruff 設定。実行: ruff check . && ruff format --check .
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "node_modules", "_site"]

[lint]
# E/W: 書式, F: 不具合のもと, I: import の並び, B: よくある間違い, UP: 古い書き方, SIM: 簡略化できる書き方
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[lint.per-file-ignores]
# テストは sys.path を足してから import する
"tests/*" = ["E402"]
