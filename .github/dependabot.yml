# 依存関係とアクションの更新を週1回 PR で提案する
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      pip: { patterns: ["*"] }
