# ブラウザ版（index.html / app.js / converter.js / style.css）だけを GitHub Pages に配信する。
# Settings → Pages → Source で「GitHub Actions」を選ぶまでは、push してもジョブはスキップされる。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - converter.js
      - style.css
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html app.js converter.js style.css _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
