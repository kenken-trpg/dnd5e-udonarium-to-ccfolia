name: Test

# main はブランチ保護でこのワークフローの成功を必須にしているので、どの変更でも動かす
# （paths-ignore で飛ばすと、ドキュメントだけの PR がマージできなくなる）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN はリポジトリの読み取りだけ
permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 4つのジョブは並行して動く
jobs:
  lint:
    name: Lint（ESLint / ruff）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: pip install -r requirements-test.txt
      - run: ruff check .

  unit:
    name: 単体テスト（JS / Python / 両版の出力一致）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      # 変換ロジックのテストに streamlit は要らない
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/test_udon_ccfolia.py

  e2e-browser:
    name: E2E（ブラウザ版）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 必要なのはヘッドレス版の Chromium だけ。ブラウザをキャッシュしても、
      # 復元後に OS の依存パッケージを入れる時間（約20秒）の方が、毎回ダウンロードする時間（約13秒）より長いのでキャッシュしない
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  e2e-streamlit:
    name: E2E（Streamlit版）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest tests/test_streamlit_app.py
